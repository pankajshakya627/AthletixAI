[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fitness-coach"
version = "0.1.0"
description = "AI-Driven Virtual Fitness Coach using LangGraph and OpenAI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Fitness Coach Team" }
]
keywords = ["fitness", "ai", "langgraph", "openai", "coaching"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "openai>=1.50.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    # Exercise research
    "tavily-python>=0.3.0",
    # Long-term memory
    "supabase>=2.0.0",
    "langgraph-checkpoint>=0.1.0",
    "langgraph-checkpoint-postgres>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
fitness-coach = "src.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
